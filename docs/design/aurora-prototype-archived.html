<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookmarks — Home Redesign Prototypes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Figtree:wght@400;500;600;700&family=Onest:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --page:#0e0e12; --page-ink:#f2f2f6; --page-mute:#9c9cab;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
body{background:var(--page);color:var(--page-ink);font-family:"Instrument Sans",system-ui,sans-serif;min-height:100vh;padding:48px 24px 80px;
  background-image:radial-gradient(60% 40% at 50% 0%,#1b1b28 0,transparent 70%)}
::selection{background:#7c6cff;color:#fff}

.intro{max-width:760px;margin:0 auto 44px;text-align:center}
.intro h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:34px;letter-spacing:-.02em;text-wrap:balance}
.intro p{color:var(--page-mute);margin-top:10px;line-height:1.55;text-wrap:pretty}

.stage{display:flex;flex-wrap:wrap;gap:56px 48px;justify-content:center;align-items:flex-start}
.slot{display:flex;flex-direction:column;align-items:center;gap:20px;width:390px;max-width:100%}
.cap{width:100%}
.cap h2{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:20px;letter-spacing:-.01em}
.cap p{color:var(--page-mute);font-size:14px;line-height:1.5;margin-top:4px;text-wrap:pretty}
.cap .tools{display:flex;gap:8px;margin-top:12px}
.tool{font:500 13px "Instrument Sans",sans-serif;color:var(--page-ink);background:#1b1b24;border:1px solid #2c2c3a;border-radius:999px;padding:8px 14px;cursor:pointer;transition:background .2s,border-color .2s}
.tool:hover{background:#242432;border-color:#3d3d52}
.tool:focus-visible{outline:2px solid #8b7dff;outline-offset:2px}

/* ---------- phone shell ---------- */
.phone{position:relative;width:390px;height:844px;border-radius:46px;overflow:hidden;background:var(--bg);color:var(--ink);
  box-shadow:0 0 0 9px #17171d,0 0 0 10px #2a2a36,0 40px 80px -20px rgba(0,0,0,.7);isolation:isolate;user-select:none}
.phone *{-webkit-tap-highlight-color:transparent}
.orbs{position:absolute;inset:0;z-index:0;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:var(--orb-o,.5)}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;z-index:1;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.status{position:absolute;top:0;left:0;right:0;height:44px;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:6px 28px 0;font:600 14px "Instrument Sans",sans-serif;color:var(--ink);pointer-events:none}
.status svg{width:16px;height:16px}
.status .r{display:flex;gap:6px;align-items:center}
.status .cam{position:absolute;left:50%;top:10px;width:12px;height:12px;border-radius:50%;background:#000;transform:translateX(-50%)}

button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.fill{fill:currentColor}

/* ---------- shared thumbnail art ---------- */
.thumb{position:relative;overflow:hidden;background:
  radial-gradient(120% 90% at 15% 10%,hsl(var(--h1) 85% 68%) 0,transparent 55%),
  radial-gradient(100% 100% at 90% 95%,hsl(var(--h2) 90% 52%) 0,transparent 62%),
  hsl(var(--h1) 55% 26%)}
.thumb::after{content:"";position:absolute;inset:0}
.k1::after{background:radial-gradient(circle at 68% 34%,rgba(255,255,255,.6) 0 13%,transparent 14%),linear-gradient(180deg,transparent 60%,rgba(0,0,0,.22))}
.k2::after{background:repeating-linear-gradient(115deg,rgba(255,255,255,.16) 0 2px,transparent 2px 15px)}
.k3::after{background:conic-gradient(from 210deg at 28% 82%,rgba(255,255,255,.34),transparent 32%),radial-gradient(circle at 80% 20%,rgba(255,255,255,.18) 0 18%,transparent 19%)}
.k4::after{background:radial-gradient(ellipse 60% 80% at 50% 100%,rgba(255,255,255,.3) 0 55%,transparent 56%),linear-gradient(180deg,transparent 50%,rgba(0,0,0,.25))}
.thumb.mono{background:linear-gradient(145deg,hsl(var(--h1) 50% 38%),hsl(var(--h2) 55% 24%));display:grid;place-items:center}
.thumb.mono::after{background:radial-gradient(circle at 25% 15%,rgba(255,255,255,.22),transparent 55%)}
.thumb.mono b{position:relative;z-index:1;font:600 34px "Bricolage Grotesque",sans-serif;color:rgba(255,255,255,.92)}
.pinbadge{position:absolute;z-index:2;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:rgba(10,10,20,.42);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.25);color:#fff}
.pinbadge .ic{width:13px;height:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.fav{width:14px;height:14px;border-radius:4px;background:linear-gradient(135deg,hsl(var(--h1) 80% 60%),hsl(var(--h2) 80% 50%));flex:none}

/* ---------- popover menu (shared) ---------- */
.menu{position:absolute;z-index:50;min-width:196px;padding:6px;border-radius:20px;opacity:0;transform:translateY(-6px) scale(.97);transform-origin:top right;pointer-events:none;transition:opacity .2s cubic-bezier(.16,1,.3,1),transform .25s cubic-bezier(.16,1,.3,1)}
.menu.open{opacity:1;transform:none;pointer-events:auto}
.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;border-radius:14px;font-size:15px;font-weight:500;transition:background .15s}
.menu button:hover{background:var(--hover)}
.menu button.on{color:var(--accent-ink)}
.menu .sep{height:1px;margin:4px 8px;background:var(--hair)}
.menu .ck{margin-left:auto;width:18px;height:18px}
.scrim{position:absolute;inset:0;z-index:45;display:none}
.scrim.open{display:block}

/* ---------- empty state (shared structure) ---------- */
.empty{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 44px 60px;text-align:center}
.stack{position:relative;width:150px;height:132px;margin-bottom:30px}
.stack i{position:absolute;left:50%;width:104px;height:104px;border-radius:30px;background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.stack i:nth-child(1){top:0;transform:translateX(-78%) rotate(-12deg);background:linear-gradient(145deg,var(--e1),transparent 90%),var(--glass)}
.stack i:nth-child(2){top:12px;transform:translateX(-22%) rotate(9deg);background:linear-gradient(145deg,var(--e2),transparent 90%),var(--glass)}
.stack i:nth-child(3){top:22px;transform:translateX(-50%);display:grid;place-items:center;box-shadow:var(--sh)}
.stack i .ic{width:36px;height:36px;color:var(--ink)}
.empty h3{font-size:24px;letter-spacing:-.015em;margin-bottom:10px}
.empty p{color:var(--mute);line-height:1.55;font-size:15px;text-wrap:balance}
.cta{margin-top:26px;height:52px;padding:0 28px;border-radius:999px;font-weight:600;font-size:16px;display:inline-flex;align-items:center;gap:8px}

/* =====================================================
   A — AURORA  (dark, orbs, frosted cards, grid)
   ===================================================== */
.t-aurora{--bg:#090a17;--ink:#eceeff;--mute:#a2a7d2;--glass:rgba(255,255,255,.065);--glass-b:rgba(255,255,255,.13);--focus:#9d90ff;--hover:rgba(255,255,255,.08);--hair:rgba(255,255,255,.1);--accent-ink:#b9b0ff;--orb-o:.55;
  --e1:rgba(124,108,255,.55);--e2:rgba(56,189,248,.45);--sh:0 14px 30px -10px rgba(0,0,0,.6);font-family:"Instrument Sans",sans-serif}
.t-aurora h1,.t-aurora h3,.t-aurora .ttl{font-family:"Bricolage Grotesque",sans-serif}
.t-aurora .orb.o1{width:340px;height:340px;left:-120px;top:-60px;background:#6b5cff}
.t-aurora .orb.o2{width:300px;height:300px;right:-130px;top:230px;background:#1fb6e8;opacity:.38}
.t-aurora .orb.o3{width:320px;height:320px;left:-80px;bottom:-40px;background:#d946ef;opacity:.34}
.t-aurora .hdr{position:absolute;z-index:20;top:0;left:0;right:0;padding:50px 20px 4px;background:linear-gradient(180deg,rgba(9,10,23,.82),rgba(9,10,23,.62) 70%,rgba(9,10,23,0));backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);-webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent)}
.t-aurora .row1{display:flex;align-items:center;gap:12px;height:48px}
.t-aurora .row1 h1{font-size:30px;font-weight:700;letter-spacing:-.03em;flex:1;display:flex;align-items:center;gap:10px}
.t-aurora .cnt{font:500 13px "Geist Mono",monospace;color:var(--mute);padding:4px 10px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-b);letter-spacing:0}
.t-aurora .rb{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--glass-b);box-shadow:inset 0 1px 0 rgba(255,255,255,.12);transition:background .2s,transform .2s cubic-bezier(.16,1,.3,1)}
.t-aurora .rb:hover{background:rgba(255,255,255,.12)}
.t-aurora .rb:active{transform:scale(.94)}
.t-aurora .chips{display:flex;gap:8px;overflow-x:auto;margin:12px -20px 0;padding:2px 20px 14px;scrollbar-width:none}
.t-aurora .chips::-webkit-scrollbar{display:none}
.t-aurora .chip{flex:none;display:flex;align-items:center;gap:8px;height:38px;padding:0 15px;border-radius:999px;font-size:14px;font-weight:500;color:var(--mute);background:var(--glass);border:1px solid var(--glass-b);transition:background .2s,color .2s,border-color .2s}
.t-aurora .chip:hover{color:var(--ink)}
.t-aurora .chip small{font:500 12px "Geist Mono",monospace;opacity:.75}
.t-aurora .chip.on{color:#fff;background:linear-gradient(135deg,rgba(124,108,255,.62),rgba(56,189,248,.38));border-color:rgba(190,180,255,.5);box-shadow:0 8px 22px -8px rgba(124,108,255,.7),inset 0 1px 0 rgba(255,255,255,.25)}
.t-aurora .sortrow{display:flex;justify-content:flex-end;padding:0 0 6px}
.t-aurora .sortbtn{display:flex;align-items:center;gap:6px;font:500 12px "Geist Mono",monospace;color:var(--mute);padding:6px 4px;border-radius:8px}
.t-aurora .sortbtn .ic{width:14px;height:14px}
.t-aurora .body{padding:178px 16px 190px}
.t-aurora .cols{display:flex;gap:12px;align-items:flex-start}
.t-aurora .col{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0}
.t-aurora .card{text-align:left;display:block;width:100%;padding:8px;border-radius:26px;background:var(--glass);border:1px solid var(--glass-b);box-shadow:0 14px 28px -14px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.1);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:transform .35s cubic-bezier(.16,1,.3,1),background .2s}
.t-aurora .card:hover{background:rgba(255,255,255,.1);transform:translateY(-2px)}
.t-aurora .card .thumb{border-radius:19px;aspect-ratio:var(--ar)}
.t-aurora .card .pinbadge{top:8px;left:8px}
.t-aurora .card .tx{padding:11px 6px 6px}
.t-aurora .card .ct{font:600 15px/1.28 "Bricolage Grotesque",sans-serif;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}
.t-aurora .card .mt{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:12.5px;color:var(--mute)}
.t-aurora .card .mt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-aurora .card .cat{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--ink);opacity:.82}
.t-aurora .list{display:flex;flex-direction:column;gap:10px}
.t-aurora .rowi{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:9px;border-radius:24px;background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.t-aurora .rowi .thumb{width:72px;height:72px;border-radius:17px;flex:none}
.t-aurora .rowi .pinbadge{top:4px;left:4px;width:20px;height:20px}
.t-aurora .rowi .pinbadge .ic{width:10px;height:10px}
.t-aurora .rowi .ct{font:600 15px/1.28 "Bricolage Grotesque",sans-serif;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.t-aurora .rowi .mt{display:flex;align-items:center;gap:7px;margin-top:6px;font-size:12.5px;color:var(--mute)}
.t-aurora .rowi .mt .dot{margin-left:4px}
.t-aurora .bar{position:absolute;z-index:25;left:16px;right:16px;bottom:22px;height:72px;border-radius:28px;display:flex;align-items:center;justify-content:space-around;padding:0 8px;background:rgba(20,22,44,.55);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);box-shadow:0 20px 40px -12px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.15)}
.t-aurora .nav{display:flex;flex-direction:column;align-items:center;gap:3px;width:98px;padding:8px 0;border-radius:20px;font-size:11.5px;font-weight:500;color:var(--mute);transition:color .2s,background .2s}
.t-aurora .nav.on{color:#fff;background:linear-gradient(180deg,rgba(124,108,255,.35),rgba(124,108,255,.12));box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.t-aurora .fab{position:absolute;z-index:26;right:22px;bottom:112px;width:62px;height:62px;border-radius:22px;display:grid;place-items:center;color:#fff;background:linear-gradient(140deg,#8a7bff,#3aa8f6);border:1px solid rgba(255,255,255,.35);box-shadow:0 18px 34px -10px rgba(98,92,255,.75),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .3s cubic-bezier(.16,1,.3,1)}
.t-aurora .fab:hover{transform:translateY(-2px) scale(1.04)}
.t-aurora .fab .ic{width:28px;height:28px;stroke-width:2.2}
.t-aurora .menu{top:100px;right:20px;background:rgba(28,30,58,.7);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(28px) saturate(1.5);-webkit-backdrop-filter:blur(28px) saturate(1.5);box-shadow:0 24px 50px -12px rgba(0,0,0,.75)}
.t-aurora .cta{background:linear-gradient(135deg,#8a7bff,#3aa8f6);color:#fff;border:1px solid rgba(255,255,255,.3);box-shadow:0 14px 28px -10px rgba(98,92,255,.7)}
.t-aurora .empty{padding-top:90px}

/* =====================================================
   B — PEARL  (light, warm mesh, white glass, list)
   ===================================================== */
.t-pearl{--bg:#f4effb;--ink:#1d1a30;--mute:#5f5b78;--glass:rgba(255,255,255,.6);--glass-b:rgba(255,255,255,.95);--focus:#5b45e0;--hover:rgba(91,69,224,.08);--hair:rgba(29,26,48,.1);--accent-ink:#5b45e0;--orb-o:.75;
  --e1:rgba(255,150,120,.6);--e2:rgba(150,130,255,.55);--sh:0 14px 28px -10px rgba(76,56,160,.3);font-family:"Figtree",sans-serif}
.t-pearl h1,.t-pearl h3,.t-pearl .ttl{font-family:"Fraunces",serif;font-weight:600}
.t-pearl .orb.o1{width:320px;height:320px;right:-90px;top:-80px;background:#ffb59a}
.t-pearl .orb.o2{width:340px;height:340px;left:-150px;top:260px;background:#c3b5ff}
.t-pearl .orb.o3{width:300px;height:300px;right:-120px;bottom:20px;background:#9ee0ff}
.t-pearl .status{color:var(--ink)}
.t-pearl .body{padding:62px 0 190px}
.t-pearl .top{display:flex;align-items:flex-end;padding:20px 20px 0;gap:10px}
.t-pearl .top .tt{flex:1}
.t-pearl .top h1{font-size:40px;line-height:1;letter-spacing:-.03em}
.t-pearl .top p{margin-top:8px;font-size:14px;color:var(--mute);font-weight:500}
.t-pearl .rb{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--glass-b);box-shadow:0 8px 20px -8px rgba(76,56,160,.28),inset 0 1px 0 #fff;transition:transform .25s cubic-bezier(.16,1,.3,1),background .2s}
.t-pearl .rb:hover{background:rgba(255,255,255,.85)}
.t-pearl .rb:active{transform:scale(.93)}
.t-pearl .chips{display:flex;gap:8px;overflow-x:auto;padding:22px 20px 8px;scrollbar-width:none}
.t-pearl .chips::-webkit-scrollbar{display:none}
.t-pearl .chip{flex:none;height:40px;padding:0 16px;border-radius:14px;display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:600;color:var(--mute);background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.9);transition:background .2s,color .2s}
.t-pearl .chip small{font-weight:600;font-size:12.5px;opacity:.7}
.t-pearl .chip:hover{background:rgba(255,255,255,.8);color:var(--ink)}
.t-pearl .chip.on{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 10px 22px -8px rgba(29,26,48,.55)}
.t-pearl .sortrow{display:flex;justify-content:space-between;align-items:center;padding:12px 24px 8px}
.t-pearl .sortrow .lbl{font-weight:600;font-size:14px;color:var(--mute)}
.t-pearl .sortbtn{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13.5px;color:var(--accent-ink);padding:6px 10px;border-radius:10px;background:rgba(91,69,224,.08)}
.t-pearl .sortbtn .ic{width:15px;height:15px}
.t-pearl .list{display:flex;flex-direction:column;gap:12px;padding:6px 16px 0}
.t-pearl .rowi{display:flex;gap:16px;align-items:center;width:100%;text-align:left;padding:10px;border-radius:28px;background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 16px 32px -16px rgba(76,56,160,.3),inset 0 1px 0 #fff;transition:transform .35s cubic-bezier(.16,1,.3,1),background .2s}
.t-pearl .rowi:hover{background:rgba(255,255,255,.82);transform:translateY(-2px)}
.t-pearl .rowi .thumb{width:88px;height:88px;border-radius:20px;flex:none}
.t-pearl .rowi .pinbadge{top:6px;left:6px;width:22px;height:22px}
.t-pearl .rowi .pinbadge .ic{width:11px;height:11px}
.t-pearl .rowi .tx{min-width:0;padding-right:6px}
.t-pearl .rowi .ct{font:600 16.5px/1.25 "Fraunces",serif;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.t-pearl .rowi .mt{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:13px;color:var(--mute);font-weight:500}
.t-pearl .rowi .cat{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;font-weight:600;padding:4px 10px 4px 8px;border-radius:999px;background:rgba(255,255,255,.7);border:1px solid rgba(29,26,48,.07)}
.t-pearl .cols{display:flex;gap:12px;align-items:flex-start;padding:6px 16px 0}
.t-pearl .col{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0}
.t-pearl .card{text-align:left;display:block;width:100%;padding:8px;border-radius:26px;background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 16px 30px -16px rgba(76,56,160,.32),inset 0 1px 0 #fff}
.t-pearl .card .thumb{border-radius:19px;aspect-ratio:var(--ar)}
.t-pearl .card .pinbadge{top:8px;left:8px}
.t-pearl .card .tx{padding:11px 6px 6px}
.t-pearl .card .ct{font:600 15px/1.25 "Fraunces",serif;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.t-pearl .card .mt{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:12.5px;color:var(--mute);font-weight:500}
.t-pearl .card .cat{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:12px;font-weight:600}
.t-pearl .bar{position:absolute;z-index:25;left:0;right:0;bottom:0;height:94px;padding:10px 22px 22px;display:flex;align-items:flex-start;justify-content:space-between;background:rgba(255,255,255,.55);border-top:1px solid rgba(255,255,255,.95);backdrop-filter:blur(26px) saturate(1.6);-webkit-backdrop-filter:blur(26px) saturate(1.6);box-shadow:0 -12px 30px -14px rgba(76,56,160,.25)}
.t-pearl .nav{display:flex;flex-direction:column;align-items:center;gap:3px;width:110px;padding:8px 0 7px;border-radius:18px;font-size:12px;font-weight:600;color:var(--mute);transition:background .2s,color .2s}
.t-pearl .nav.on{background:var(--ink);color:#fff}
.t-pearl .fab{position:absolute;z-index:26;right:20px;bottom:112px;height:58px;padding:0 24px 0 18px;border-radius:999px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;color:#fff;background:linear-gradient(135deg,#ff7a5c,#9a4dff);border:1px solid rgba(255,255,255,.5);box-shadow:0 18px 32px -10px rgba(154,77,255,.6),inset 0 1px 0 rgba(255,255,255,.45);transition:transform .3s cubic-bezier(.16,1,.3,1)}
.t-pearl .fab:hover{transform:translateY(-2px)}
.t-pearl .fab .ic{width:24px;height:24px;stroke-width:2.3}
.t-pearl .menu{top:100px;right:20px;background:rgba(255,255,255,.78);border:1px solid #fff;backdrop-filter:blur(28px) saturate(1.6);-webkit-backdrop-filter:blur(28px) saturate(1.6);box-shadow:0 24px 50px -14px rgba(76,56,160,.4)}
.t-pearl .cta{background:var(--ink);color:#fff;box-shadow:0 14px 26px -10px rgba(29,26,48,.55)}
.t-pearl .empty h3{font-size:28px}

/* =====================================================
   C — LAGOON  (deep teal, spotlight pinned + list, centre dock)
   ===================================================== */
.t-lagoon{--bg:#051a1d;--ink:#e6fbf5;--mute:#8dbab3;--glass:rgba(220,255,245,.06);--glass-b:rgba(190,255,235,.15);--focus:#4ff0be;--hover:rgba(190,255,235,.09);--hair:rgba(190,255,235,.12);--accent-ink:#4ff0be;--orb-o:.5;
  --e1:rgba(62,224,176,.5);--e2:rgba(251,191,36,.38);--sh:0 14px 30px -10px rgba(0,0,0,.6);font-family:"Onest",sans-serif}
.t-lagoon h1,.t-lagoon h3,.t-lagoon .ttl{font-family:"Onest",sans-serif}
.t-lagoon .orb.o1{width:360px;height:300px;left:-100px;top:-90px;background:#0fb98f}
.t-lagoon .orb.o2{width:300px;height:300px;right:-140px;top:360px;background:#0e7490}
.t-lagoon .orb.o3{width:260px;height:260px;left:-60px;bottom:40px;background:#f5b53a;opacity:.2}
.t-lagoon .body{padding:62px 0 200px}
.t-lagoon .top{padding:18px 20px 0}
.t-lagoon .top h1{font-size:34px;font-weight:700;letter-spacing:-.035em;display:flex;align-items:baseline;gap:10px}
.t-lagoon .top h1 span{font:500 14px "Geist Mono",monospace;color:var(--mute);letter-spacing:0}
.t-lagoon .searchbar{margin:16px 20px 0;height:54px;border-radius:20px;display:flex;align-items:center;gap:10px;padding:0 8px 0 16px;background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.t-lagoon .searchbar .s{flex:1;display:flex;align-items:center;gap:10px;height:100%;text-align:left;color:var(--mute);font-size:15.5px}
.t-lagoon .rb{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;transition:background .2s}
.t-lagoon .rb:hover{background:var(--hover)}
.t-lagoon .chips{display:flex;gap:8px;overflow-x:auto;padding:18px 20px 4px;scrollbar-width:none}
.t-lagoon .chips::-webkit-scrollbar{display:none}
.t-lagoon .chip{flex:none;display:flex;align-items:center;gap:8px;height:36px;padding:0 14px 0 12px;border-radius:12px;font-size:14px;font-weight:500;color:var(--mute);background:transparent;border:1px solid var(--hair);transition:background .2s,color .2s,border-color .2s}
.t-lagoon .chip:hover{color:var(--ink)}
.t-lagoon .chip.on{color:#032720;background:linear-gradient(135deg,#5ff5c6,#2fc9a3);border-color:transparent;font-weight:600;box-shadow:0 10px 24px -10px rgba(63,240,190,.7)}
.t-lagoon .chip.on .dot{background:#032720}
.t-lagoon .chip small{font:500 12px "Geist Mono",monospace;opacity:.7}
.t-lagoon .sec{display:flex;justify-content:space-between;align-items:center;padding:26px 20px 12px}
.t-lagoon .sec h2{font-size:17px;font-weight:600;letter-spacing:-.01em}
.t-lagoon .sortbtn{display:flex;align-items:center;gap:6px;font:500 12px "Geist Mono",monospace;color:var(--mute);padding:6px 8px;border-radius:10px}
.t-lagoon .sortbtn:hover{background:var(--hover)}
.t-lagoon .sortbtn .ic{width:14px;height:14px}
.t-lagoon .rail{display:flex;gap:12px;overflow-x:auto;padding:0 20px 4px;scroll-snap-type:x mandatory;scrollbar-width:none}
.t-lagoon .rail::-webkit-scrollbar{display:none}
.t-lagoon .feat{position:relative;flex:none;width:272px;height:204px;border-radius:28px;overflow:hidden;scroll-snap-align:start;text-align:left;border:1px solid var(--glass-b);box-shadow:0 20px 36px -16px rgba(0,0,0,.7);transition:transform .4s cubic-bezier(.16,1,.3,1)}
.t-lagoon .feat:hover{transform:translateY(-3px)}
.t-lagoon .feat .thumb{position:absolute;inset:0}
.t-lagoon .feat .pinbadge{top:12px;left:12px}
.t-lagoon .feat .gl{position:absolute;left:8px;right:8px;bottom:8px;padding:12px 14px 12px;border-radius:21px;background:rgba(6,32,34,.46);border:1px solid rgba(220,255,245,.2);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4)}
.t-lagoon .feat .ct{font-weight:600;font-size:15.5px;line-height:1.28;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:#f2fffb}
.t-lagoon .feat .mt{display:flex;align-items:center;gap:7px;margin-top:6px;font-size:12.5px;color:#bfe5dc}
.t-lagoon .list{display:flex;flex-direction:column;padding:0 12px}
.t-lagoon .rowi{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:10px 8px;border-radius:20px;transition:background .2s}
.t-lagoon .rowi:hover{background:var(--glass)}
.t-lagoon .rowi + .rowi{box-shadow:0 -1px 0 var(--hair)}
.t-lagoon .rowi .thumb{width:60px;height:60px;border-radius:16px;flex:none}
.t-lagoon .rowi .pinbadge{top:3px;left:3px;width:19px;height:19px}
.t-lagoon .rowi .pinbadge .ic{width:10px;height:10px}
.t-lagoon .rowi .tx{min-width:0;flex:1}
.t-lagoon .rowi .ct{font-weight:600;font-size:15.5px;line-height:1.28;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.t-lagoon .rowi .mt{display:flex;align-items:center;gap:7px;margin-top:5px;font-size:12.5px;color:var(--mute)}
.t-lagoon .rowi .catd{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);flex:none}
.t-lagoon .cols{display:flex;gap:12px;align-items:flex-start;padding:0 16px}
.t-lagoon .col{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0}
.t-lagoon .card{text-align:left;display:block;width:100%;padding:7px;border-radius:24px;background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.t-lagoon .card .thumb{border-radius:18px;aspect-ratio:var(--ar)}
.t-lagoon .card .pinbadge{top:8px;left:8px}
.t-lagoon .card .tx{padding:10px 6px 5px}
.t-lagoon .card .ct{font-weight:600;font-size:14.5px;line-height:1.28;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.t-lagoon .card .mt{display:flex;align-items:center;gap:7px;margin-top:7px;font-size:12.5px;color:var(--mute)}
.t-lagoon .dock{position:absolute;z-index:25;left:22px;right:22px;bottom:24px;height:70px;border-radius:999px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:rgba(8,40,42,.55);border:1px solid rgba(190,255,235,.2);backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);box-shadow:0 22px 40px -14px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.14)}
.t-lagoon .nav{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:62px;height:52px;border-radius:20px;font-size:11px;font-weight:500;color:var(--mute);transition:color .2s}
.t-lagoon .nav.on{color:var(--accent-ink)}
.t-lagoon .nav.on::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--accent-ink);box-shadow:0 0 10px var(--accent-ink);margin-top:-1px}
.t-lagoon .nav.on span{display:none}
.t-lagoon .nav:not(.on)::after{display:none}
.t-lagoon .add{width:66px;height:66px;margin-top:-26px;border-radius:50%;display:grid;place-items:center;color:#032720;background:linear-gradient(145deg,#7bffd6,#27c39b);border:1px solid rgba(255,255,255,.5);box-shadow:0 18px 30px -8px rgba(63,240,190,.55),0 0 0 7px rgba(5,26,29,.55),inset 0 1px 0 rgba(255,255,255,.6);transition:transform .3s cubic-bezier(.16,1,.3,1)}
.t-lagoon .add:hover{transform:translateY(-3px) scale(1.04)}
.t-lagoon .add .ic{width:30px;height:30px;stroke-width:2.4}
.t-lagoon .menu{top:150px;right:28px;background:rgba(8,44,46,.72);border:1px solid rgba(190,255,235,.2);backdrop-filter:blur(28px) saturate(1.5);-webkit-backdrop-filter:blur(28px) saturate(1.5);box-shadow:0 24px 50px -12px rgba(0,0,0,.75)}
.t-lagoon .cta{background:linear-gradient(135deg,#7bffd6,#27c39b);color:#032720}
.t-lagoon .empty h3{font-weight:700;letter-spacing:-.03em}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card,.rowi,.feat{animation:rise .5s cubic-bezier(.16,1,.3,1) backwards}
</style>
</head>
<body>

<header class="intro">
  <h1>Bookmarks — Home screen, three directions</h1>
  <p>All three are interactive: tap category chips to filter, open the ⋮ / sort menu to switch grid or list and change sort order, and use “Empty state” to see the no-bookmarks screen. Scroll inside each phone.</p>
</header>

<main class="stage" id="stage"></main>

<script>
/* ---------- data (mirrors the app's Bookmark / Category model) ---------- */
const CATS = [
  {id:'design',  name:'Design',  color:'#a78bfa'},
  {id:'dev',     name:'Dev',     color:'#38bdf8'},
  {id:'travel',  name:'Travel',  color:'#fb923c'},
  {id:'recipes', name:'Recipes', color:'#f472b6'},
  {id:'health',  name:'Health',  color:'#4ade80'},
];
const BM = [
  {t:'How we rebuilt our design system in six weeks', s:'linear.app',        c:'design', pin:1, ar:1.25, h1:262,h2:215,k:1},
  {t:'The quiet revolution in type design',           s:'typographica.org',  c:'design', pin:0, ar:.82,  h1:330,h2:20, k:2},
  {t:'Vegetable biryani, the slow way',               s:'cooking.nytimes.com',c:'recipes',pin:0, ar:1.05, h1:28, h2:350,k:3},
  {t:'Rust ownership, visualized',                    s:'fasterthanli.me',   c:'dev',    pin:0, ar:1.45, h1:200,h2:150,k:4},
  {t:'Kyoto in November: a four-day plan',            s:'lonelyplanet.com',  c:'travel', pin:1, ar:.9,   h1:18, h2:340,k:1},
  {t:'Why local-first software matters',              s:'inkandswitch.com',  c:'dev',    pin:1, ar:1.2,  h1:170,h2:230,k:3},
  {t:'Brutalist houses of Mumbai',                    s:'dezeen.com',        c:'design', pin:0, ar:1.1,  h1:45, h2:12, k:2},
  {t:'A ten-minute stretching routine',               s:'healthline.com',    c:'health', pin:0, ar:1,    h1:140,h2:190,k:0, mono:1},
];
BM.forEach((b,i)=>b.i=i);
const catById = id => CATS.find(c=>c.id===id);
const SORTS = {newest:'Newest', oldest:'Oldest', az:'Title A–Z', cat:'Category'};
const SHORT = {newest:'Newest', oldest:'Oldest', az:'A–Z', cat:'Category'};

/* ---------- icons ---------- */
const I = {
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  more:'<circle cx="12" cy="5" r="1.3" class="f"/><circle cx="12" cy="12" r="1.3" class="f"/><circle cx="12" cy="19" r="1.3" class="f"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  bookmark:'<path d="M6.5 4h11a.5.5 0 0 1 .5.5V21l-6-4-6 4V4.5a.5.5 0 0 1 .5-.5Z"/>',
  folder:'<path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2.2h7.5A2.5 2.5 0 0 1 21 9.7v7.8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5Z"/>',
  sliders:'<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  pin:'<path d="M12 16.5V22M8.5 3h7l-1 6 3 3.2V14H6.5v-1.8L9.5 9Z"/>',
  grid:'<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
  list:'<path d="M4 6h16M4 12h16M4 18h16"/>',
  sort:'<path d="M8 4v16m0 0-3-3m3 3 3-3M16 20V4m0 0-3 3m3-3 3 3"/>',
  check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
};
const ic = (n,cls='') => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${I[n].replace(/class="f"/g,'fill="currentColor" stroke="none"')}</svg>`;
const statusBar = `<div class="status"><span>9:41</span><i class="cam"></i><span class="r">
<svg viewBox="0 0 16 16" fill="currentColor"><path d="M1 11h2v3H1zM5 8h2v6H5zM9 5h2v9H9zM13 2h2v12h-2z"/></svg>
<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="4" width="12" height="8" rx="2"/><path d="M15 7v2" stroke-linecap="round"/><rect x="3" y="5.5" width="7" height="5" rx="1" fill="currentColor" stroke="none"/></svg></span></div>`;

/* ---------- reusable pieces ---------- */
const thumbStyle = b => `--h1:${b.h1};--h2:${b.h2}`;
const thumb = (b, extra='') => b.mono
  ? `<div class="thumb mono ${extra}" style="${thumbStyle(b)};--ar:${b.ar}"><b>${b.s[0].toUpperCase()}</b>${b.pin?pinBadge():''}</div>`
  : `<div class="thumb k${b.k} ${extra}" style="${thumbStyle(b)};--ar:${b.ar}">${b.pin?pinBadge():''}</div>`;
const pinBadge = () => `<span class="pinbadge" aria-label="Pinned">${ic('pin','fill')}</span>`;
const fav = b => `<i class="fav" style="${thumbStyle(b)}"></i>`;

function sorted(S){
  let a = BM.filter(b=>!S.cat || b.c===S.cat);
  if(S.sort==='newest') a.sort((x,y)=>x.i-y.i);
  if(S.sort==='oldest') a.sort((x,y)=>y.i-x.i);
  if(S.sort==='az')     a.sort((x,y)=>x.t.localeCompare(y.t));
  if(S.sort==='cat')    a.sort((x,y)=>catById(x.c).name.localeCompare(catById(y.c).name)||x.i-y.i);
  return a;
}
function chips(S){
  const all = `<button class="chip ${!S.cat?'on':''}" data-a="cat" data-v="">All <small>${BM.length}</small></button>`;
  return all + CATS.map(c=>{
    const n = BM.filter(b=>b.c===c.id).length;
    return `<button class="chip ${S.cat===c.id?'on':''}" data-a="cat" data-v="${c.id}"><i class="dot" style="--c:${c.color}"></i>${c.name} <small>${n}</small></button>`;
  }).join('');
}
function menu(S){
  const it = (a,v,label,on,icon) => `<button class="${on?'on':''}" data-a="${a}" data-v="${v}">${icon?ic(icon):''}${label}${on?ic('check','ck'):''}</button>`;
  return `<div class="scrim ${S.menu?'open':''}" data-a="menu"></div>
  <div class="menu ${S.menu?'open':''}" role="menu">
    ${it('view', S.view==='grid'?'list':'grid', S.view==='grid'?'Switch to list':'Switch to grid', false, S.view==='grid'?'list':'grid')}
    <div class="sep"></div>
    ${Object.entries(SORTS).map(([k,l])=>it('sort',k,'Sort: '+l,S.sort===k)).join('')}
  </div>`;
}
function gridCards(list, S){            // staggered 2-column, shortest-column-first like the app
  const cols=[[],[]], h=[0,0];
  list.forEach(b=>{ const k = h[0]<=h[1]?0:1; cols[k].push(b); h[k]+=1/b.ar+.55; });
  return `<div class="cols">${cols.map(c=>`<div class="col">${c.map(b=>gridCard(b)).join('')}</div>`).join('')}</div>`;
}
function gridCard(b){
  const c = catById(b.c);
  return `<button class="card" data-a="open">${thumb(b)}<div class="tx"><div class="ct">${b.t}</div>
    <div class="mt">${fav(b)}<span>${b.s}</span></div>
    <div class="cat"><i class="dot" style="--c:${c.color}"></i>${c.name}</div></div></button>`;
}
function emptyState(){
  return `<div class="empty"><div class="stack"><i></i><i></i><i>${ic('link')}</i></div>
    <h3>Nothing saved yet</h3>
    <p>Share a link to this app from anywhere — tap Share in your browser and pick Bookmarks.</p>
    <button class="cta" data-a="add">${ic('plus')}Paste a link</button></div>`;
}
const orbs = `<div class="orbs"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i></div>`;
const navItems = (S,labels=true) => [['bookmark','Bookmarks'],['folder','Categories'],['sliders','Settings']];

/* ---------- A: Aurora ---------- */
function aurora(S){
  const list = sorted(S);
  const rows = list.map(b=>{const c=catById(b.c);return `<button class="rowi" data-a="open">${thumb(b)}<div style="min-width:0"><div class="ct">${b.t}</div><div class="mt">${fav(b)}<span>${b.s}</span><i class="dot" style="--c:${c.color}"></i><span>${c.name}</span></div></div></button>`}).join('');
  return `${orbs}${statusBar}
  <div class="hdr">
    <div class="row1"><h1>Bookmarks <span class="cnt">${BM.length}</span></h1>
      <button class="rb" data-a="search" aria-label="Search">${ic('search')}</button>
      <button class="rb" data-a="menu" aria-label="More options">${ic('more')}</button></div>
    ${S.empty?'':`<div class="chips">${chips(S)}</div>`}
  </div>
  <div class="scroll"><div class="body">
    ${S.empty?'':`<div class="sortrow"><button class="sortbtn" data-a="menu">${ic('sort')}${SHORT[S.sort]}</button></div>
    ${S.view==='grid'?gridCards(list,S):`<div class="list">${rows}</div>`}`}
  </div></div>
  ${S.empty?emptyState():`<button class="fab" data-a="add" aria-label="Add bookmark">${ic('plus')}</button>`}
  <nav class="bar">${navItems().map(([i,l],n)=>`<button class="nav ${n===0?'on':''}">${ic(i)}<span>${l}</span></button>`).join('')}</nav>
  ${menu(S)}`;
}

/* ---------- B: Pearl ---------- */
function pearl(S){
  const list = sorted(S);
  const rows = list.map(b=>{const c=catById(b.c);return `<button class="rowi" data-a="open">${thumb(b)}<div class="tx"><div class="ct">${b.t}</div><div class="mt">${fav(b)}<span>${b.s}</span></div><span class="cat"><i class="dot" style="--c:${c.color}"></i>${c.name}</span></div></button>`}).join('');
  return `${orbs}${statusBar}
  <div class="scroll"><div class="body">
    <div class="top"><div class="tt"><h1>Bookmarks</h1><p>${BM.length} saved · ${BM.filter(b=>b.pin).length} pinned</p></div>
      <button class="rb" data-a="search" aria-label="Search">${ic('search')}</button>
      <button class="rb" data-a="menu" aria-label="More options">${ic('more')}</button></div>
    ${S.empty?'':`<div class="chips">${chips(S)}</div>
    <div class="sortrow"><span class="lbl">${S.cat?catById(S.cat).name:'Everything'}</span><button class="sortbtn" data-a="menu">${ic('sort')}${SHORT[S.sort]}</button></div>
    ${S.view==='grid'?gridCards(list,S):`<div class="list">${rows}</div>`}`}
  </div></div>
  ${S.empty?emptyState():`<button class="fab" data-a="add" aria-label="Add bookmark">${ic('plus')}Add link</button>`}
  <nav class="bar">${navItems().map(([i,l],n)=>`<button class="nav ${n===0?'on':''}">${ic(i)}<span>${l}</span></button>`).join('')}</nav>
  ${menu(S)}`;
}

/* ---------- C: Lagoon ---------- */
function lagoon(S){
  const list = sorted(S);
  const pinned = list.filter(b=>b.pin);
  const rows = list.map(b=>{const c=catById(b.c);return `<button class="rowi" data-a="open">${thumb(b)}<div class="tx"><div class="ct">${b.t}</div><div class="mt">${fav(b)}<span>${b.s}</span></div></div><span class="catd"><i class="dot" style="--c:${c.color}"></i>${c.name}</span></button>`}).join('');
  const feats = pinned.map(b=>`<button class="feat" data-a="open">${thumb(b)}<div class="gl"><div class="ct">${b.t}</div><div class="mt">${fav(b)}<span>${b.s}</span></div></div></button>`).join('');
  return `${orbs}${statusBar}
  <div class="scroll"><div class="body">
    <div class="top"><h1>Bookmarks <span>${BM.length}</span></h1></div>
    <div class="searchbar"><button class="s" data-a="search">${ic('search')}Search your links</button>
      <button class="rb" data-a="menu" aria-label="More options">${ic('more')}</button></div>
    ${S.empty?'':`<div class="chips">${chips(S)}</div>
    ${pinned.length?`<div class="sec"><h2>Pinned</h2></div><div class="rail">${feats}</div>`:''}
    <div class="sec"><h2>${S.cat?catById(S.cat).name:'All links'}</h2><button class="sortbtn" data-a="menu">${ic('sort')}${SHORT[S.sort]}</button></div>
    ${S.view==='grid'?gridCards(list,S):`<div class="list">${rows}</div>`}`}
  </div></div>
  ${S.empty?emptyState():''}
  <nav class="dock">
    <button class="nav on">${ic('bookmark')}<span>Bookmarks</span></button>
    <button class="nav">${ic('folder')}<span>Categories</span></button>
    <button class="add" data-a="add" aria-label="Add bookmark">${ic('plus')}</button>
    <button class="nav">${ic('sliders')}<span>Settings</span></button>
  </nav>
  ${menu(S)}`;
}
/* Lagoon dock: 4 slots (Bookmarks, Categories, +, Settings) — drop the spacer */

/* ---------- mounting ---------- */
const DEFS = [
  {key:'aurora', fn:aurora, title:'A · Aurora', blurb:'Dark ink base with drifting violet / cyan / magenta light. Image-forward staggered grid on frosted cards, floating glass tab bar, gradient add button.', view:'grid'},
  {key:'pearl',  fn:pearl,  title:'B · Pearl',  blurb:'Light, warm mesh of peach, lilac and sky behind white glass. Big serif title, roomy list rows with large thumbnails, extended “Add link” button.', view:'list'},
  {key:'lagoon', fn:lagoon, title:'C · Lagoon', blurb:'Deep teal with mint glow. Pinned links become a spotlight rail, the rest a quiet list; search sits up top and “add” lives in the centre of a floating dock.', view:'list'},
];
const stage = document.getElementById('stage');
DEFS.forEach(d=>{
  d.S = {cat:'', view:d.view, sort:'newest', menu:false, empty:false};
  const slot = document.createElement('section'); slot.className='slot';
  slot.innerHTML = `<div class="phone t-${d.key}" id="p-${d.key}"></div>
   <div class="cap"><h2>${d.title}</h2><p>${d.blurb}</p>
   <div class="tools"><button class="tool" data-tool="empty">Empty state</button><button class="tool" data-tool="reset">Reset</button></div></div>`;
  stage.appendChild(slot);
  const phone = slot.querySelector('.phone');
  const draw = () => {
    const st = phone.querySelector('.scroll'); const y = st?st.scrollTop:0;
    const cr = phone.querySelector('.chips'); const cx = cr?cr.scrollLeft:0;
    const noAnim = phone.dataset.drawn==='1';
    phone.innerHTML = d.fn(d.S);
    if(noAnim) phone.querySelectorAll('.card,.rowi,.feat').forEach(e=>e.style.animation='none');
    phone.dataset.drawn='1';
    const s2 = phone.querySelector('.scroll'); if(s2) s2.scrollTop = y;
    const c2 = phone.querySelector('.chips'); if(c2) c2.scrollLeft = cx;
  };
  phone.addEventListener('click', e=>{
    const el = e.target.closest('[data-a]'); if(!el) return;
    const a = el.dataset.a, v = el.dataset.v;
    if(a==='cat') d.S.cat = v;
    else if(a==='view'){ d.S.view = v; d.S.menu=false; }
    else if(a==='sort'){ d.S.sort = v; d.S.menu=false; }
    else if(a==='menu') d.S.menu = !d.S.menu;
    else return;
    draw();
  });
  slot.querySelector('[data-tool="empty"]').onclick = ()=>{ d.S.empty=!d.S.empty; d.S.menu=false; draw(); };
  slot.querySelector('[data-tool="reset"]').onclick = ()=>{ d.S={cat:'',view:d.view,sort:'newest',menu:false,empty:false}; draw(); };
  draw();
});
</script>
</body>
</html>
