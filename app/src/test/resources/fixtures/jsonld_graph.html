<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<title>Graph Form</title>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    { "@type": "WebSite", "name": "Graph Site" },
    { "@type": "NewsArticle",
      "headline": "Headline from the graph",
      "description": "Description from the graph node.",
      "image": ["https://example.com/g1.jpg", "https://example.com/g2.jpg"],
      "publisher": { "@type": "Organization", "name": "Graph Publishing" } }
  ]
}
</script>
</head><body></body></html>
