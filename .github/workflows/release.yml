name: Release

# Publishes a GitHub Release whenever a push to master carries a version that has no tag yet.
# The release skill (.claude/skills/release) bumps versionName/versionCode in android/app/build.gradle.kts
# and "version" in web/package.json, and writes the CHANGELOG section. This workflow builds the web zip,
# the signed APK and (only when backend/ changed since the previous release) the backend zip, then
# creates the release from them.
#
# - Version: `versionName` in android/app/build.gradle.kts (must equal web/package.json "version").
# - Tag: the bare version (`3.1.0`), matching every earlier release. It is created by
#   `gh release create` on the pushed commit, so no manual tagging.
# - Notes: the `## X.Y.Z — date` section of CHANGELOG.md, plus a downloads table and the APK
#   certificate.
# - Idempotent: if the tag already exists the run does nothing, so re-runs, unrelated pushes and
#   several pushes in a row can never release a version twice.
#
# Secrets: ANDROID_KEYSTORE_BASE64 (base64 of android/keystore/release.jks),
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
on:
  push:
    branches: [master]
    paths:
      - 'android/app/build.gradle.kts'
      - 'web/package.json'
      - 'CHANGELOG.md'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Every release must be signed by this certificate, or Android refuses to install it as an
  # update. Change it only if the signing key is deliberately replaced.
  EXPECTED_CERT_SHA256: '30:d5:51:7e:49:ca:91:9d:7f:52:81:00:8b:d1:e0:92:1b:7b:53:f5:54:08:37:fc:07:60:17:6c:53:d6:04:82'

jobs:
  check:
    # A manual run from another branch must not publish a release.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.tag.outputs.release }}
      backend: ${{ steps.backend.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags, to find the previous release

      - id: version
        name: Read version
        run: |
          version="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -1)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=android/app/build.gradle.kts::versionName '$version' is not X.Y.Z"
            exit 1
          fi
          pkg="$(jq -r .version web/package.json)"
          if [[ "$pkg" != "$version" ]]; then
            echo "::error file=web/package.json::version $pkg does not match android versionName $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - id: tag
        name: Skip if already released
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" "refs/tags/v$VERSION" > /dev/null; then
            echo "Tag $VERSION already exists; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - id: backend
        name: Did backend/ change since the last release?
        if: steps.tag.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prev="$(git tag --list | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "$VERSION" | sort -V | tail -1)"
          if [[ -z "$prev" ]]; then
            echo "No previous release; including the backend zip."
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            ref="$(git tag --list "$prev" "v$prev" | head -1)"
            if git diff --quiet "$ref" HEAD -- backend; then
              echo "backend/ unchanged since $ref."
              echo "backend=false" >> "$GITHUB_OUTPUT"
            else
              echo "backend/ changed since $ref; including the backend zip."
              echo "backend=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Extract CHANGELOG section
        if: steps.tag.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Everything between `## X.Y.Z …` and the next `## ` heading, blank edges trimmed.
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found
          ' CHANGELOG.md | sed -e '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > changelog-section.md
          if [[ ! -s changelog-section.md ]]; then
            echo "::error file=CHANGELOG.md::no '## $VERSION — YYYY-MM-DD' section (or it is empty)"
            exit 1
          fi
          cat changelog-section.md

      - if: steps.tag.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: changelog-section
          path: changelog-section.md

  web:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      # Same default as deploy.yml: an empty string would defeat the `??` fallback in src/api/client.ts.
      - run: pnpm build
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE || 'https://api.bookmark.slowatcoding.com' }}

      # Files at the zip root (including the hidden .htaccess), ready to upload to any static host.
      - name: Zip web/dist
        run: |
          cd dist
          zip -qr "$GITHUB_WORKSPACE/bookmark-web-$VERSION.zip" . -x '.DS_Store'
          unzip -l "$GITHUB_WORKSPACE/bookmark-web-$VERSION.zip" | grep -E ' (index\.html|\.htaccess)$'

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: bookmark-web-${{ needs.check.outputs.version }}.zip
          if-no-files-found: error

  backend:
    needs: check
    if: needs.check.outputs.release == 'true' && needs.check.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # Contents of backend/ at the zip root, not the folder itself (see docs/MILESWEB_DEPLOYMENT_GUIDE.md).
      - name: Zip backend
        run: |
          cd backend
          zip -qr "$GITHUB_WORKSPACE/bookmark-backend-$VERSION.zip" . -x '.DS_Store'

      - uses: actions/upload-artifact@v4
        with:
          name: backend
          path: bookmark-backend-${{ needs.check.outputs.version }}.zip
          if-no-files-found: error

  android:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # android/gradle/gradle-daemon-jvm.properties pins toolchainVersion=25.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Signing secrets are missing; an unsigned APK cannot be released."
            exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/release.jks
          {
            echo "storeFile=keystore/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      # The wrapper may lose its executable bit when committed from Windows.
      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease

      - name: Verify signing certificate
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          out="$("$apksigner" verify --print-certs "$apk" 2>&1)" || { echo "$out"; echo "::error::apksigner could not verify the APK"; exit 1; }
          echo "$out" | grep -v '^WARNING:'
          # The line's prefix varies by build-tools version ("Signer #1", "V2 Signer", …), so match on the tail.
          digest="$(echo "$out" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -1 \
            | tr 'A-F' 'a-f' | sed 's/../&:/g; s/:$//')"
          echo "APK certificate: $digest"
          if [[ "$digest" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::APK is signed by $digest, expected $EXPECTED_CERT_SHA256. Android would refuse it as an update."
            exit 1
          fi
          cp "$apk" "$GITHUB_WORKSPACE/bookmark-$VERSION.apk"

      - name: Remove signing key
        if: always()
        run: rm -rf keystore keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: bookmark-${{ needs.check.outputs.version }}.apk
          if-no-files-found: error

  release:
    needs: [check, web, backend, android]
    # `backend` is skipped when backend/ is unchanged; that must not block the release.
    if: |
      always() && needs.check.outputs.release == 'true' &&
      needs.web.result == 'success' && needs.android.result == 'success' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums and notes
        run: |
          cd artifacts
          apk="bookmark-$VERSION.apk"
          zip="bookmark-web-$VERSION.zip"
          backend="bookmark-backend-$VERSION.zip"
          files=("$apk" "$zip")
          [[ -f "$backend" ]] && files+=("$backend")
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            cat changelog-section.md
            echo
            echo "## Downloads"
            echo
            echo "| File | What |"
            echo "| --- | --- |"
            echo "| \`$apk\` | Android app. Install it over an earlier version and your data stays. |"
            echo "| \`$zip\` | Production build of the web app. Upload its contents to the web docroot (deployment guide, section 11). |"
            [[ -f "$backend" ]] && echo "| \`$backend\` | PHP API. Upload its contents to the API docroot (deployment guide, section 3). |"
            echo "| \`SHA256SUMS.txt\` | Checksums for the files above. |"
            echo
            echo "**APK signing certificate (SHA-256):**"
            echo "\`$EXPECTED_CERT_SHA256\`"
            echo
            echo "Full details are in [CHANGELOG.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$VERSION/CHANGELOG.md)."
          } > notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          assets=("bookmark-$VERSION.apk" "bookmark-web-$VERSION.zip" SHA256SUMS.txt)
          [[ -f "bookmark-backend-$VERSION.zip" ]] && assets+=("bookmark-backend-$VERSION.zip")
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Bookmark $VERSION" \
            --notes-file notes.md \
            "${assets[@]}"
